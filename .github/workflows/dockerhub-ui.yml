name: build | Build and Push Cognee UI Docker Image to dockerhub

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Fork-safety: this job publishes to Docker Hub with org-owned credentials.
# A fork without the DOCKER_USERNAME/DOCKER_PASSWORD secrets fails here on
# every push (Login: "Username and password required"), so the job self-skips
# until the secrets exist.
concurrency:
  group: dockerhub-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest
    if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: cognee/cognee-ui
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./cognee-frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=cognee/cognee-ui:buildcache
          cache-to: type=registry,ref=cognee/cognee-ui:buildcache,mode=max

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}
