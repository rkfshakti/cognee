name: test | Docker image validation (scheduled)

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: "build & validate ${{ matrix.name }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cognee
            dockerfile: Dockerfile
            context: .
            max_bytes: "6442450944"
          - name: cognee-mcp
            dockerfile: cognee-mcp/Dockerfile
            context: .
            max_bytes: "10737418240"

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Build image locally
        run: |
          docker buildx build --platform linux/amd64 \
            --file "${{ matrix.dockerfile }}" \
            --tag "${{ matrix.name }}:validation" \
            --load \
            "${{ matrix.context }}"

      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ matrix.name }}:validation
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Boot, metadata checks, and health
        run: |
          chmod +x scripts/docker_validation.sh
          scripts/docker_validation.sh \
            "${{ matrix.name }}" \
            validation \
            "${{ matrix.max_bytes }}"