name: build | Build and Push Cognee MCP Docker Image to dockerhub

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Fork-safety: skip when the org-owned Docker Hub credentials are absent
# (a fork cannot push to cognee/* anyway). Gate-job pattern, not a job-level
# `if:` reading secrets — GitHub rejects that on this repo (startup failure,
# zero jobs); see dockerhub-ui.yml.
jobs:
  secret-gate:
    runs-on: ubuntu-latest
    outputs:
      has_secrets: ${{ steps.check.outputs.has_secrets }}
    steps:
      - id: check
        env:
          U: ${{ secrets.DOCKER_USERNAME }}
          P: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$U" ] && [ -n "$P" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi

  docker-build-and-push:
    needs: secret-gate
    if: needs.secret-gate.outputs.has_secrets == 'true'
    runs-on:
      group: Default
      labels:
        - docker_build_runner

    steps:
      - name: Check and free disk space before build
        run: |
          echo "=== Before cleanup ==="
          df -h
          echo "Removing unused preinstalled SDKs to free space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          docker system prune -af || true
          echo "=== After cleanup ==="
          df -h

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
        with:
          buildkitd-flags: --root /tmp/buildkit

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: cognee/cognee-mcp
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          file: cognee-mcp/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=cognee/cognee-mcp:buildcache
          cache-to: type=registry,ref=cognee/cognee-mcp:buildcache,mode=max


      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}
