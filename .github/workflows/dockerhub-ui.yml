name: build | Build and Push Cognee UI Docker Image to dockerhub

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Fork-safety: this job publishes to Docker Hub with org-owned credentials.
# A fork without the DOCKER_USERNAME/DOCKER_PASSWORD secrets fails here on
# every push (Login: "Username and password required"), so it self-skips
# until the secrets exist.
#
# The check runs in a GATE JOB, not in a job-level `if:` — GitHub rejects a
# workflow file whose job `if:` reads the secrets context on this repo
# (startup failure with zero jobs; verified by probe). A gate job reads the
# secret in a step, publishes `has_secrets` as an output, and the publish job
# keys off it.
concurrency:
  group: dockerhub-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-gate:
    runs-on: ubuntu-latest
    outputs:
      has_secrets: ${{ steps.check.outputs.has_secrets }}
    steps:
      - id: check
        env:
          U: ${{ secrets.DOCKER_USERNAME }}
          P: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$U" ] && [ -n "$P" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi

  docker-build-and-push:
    needs: secret-gate
    if: needs.secret-gate.outputs.has_secrets == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: cognee/cognee-ui
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./cognee-frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=cognee/cognee-ui:buildcache
          cache-to: type=registry,ref=cognee/cognee-ui:buildcache,mode=max

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}
